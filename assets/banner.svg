<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17"/>
      <stop offset="50%" stop-color="#101935"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .orb-1 {
      animation: float-orb1 12s ease-in-out infinite alternate;
    }
    .orb-2 {
      animation: float-orb2 14s ease-in-out infinite alternate;
    }
    .flow-line-1 {
      stroke-dasharray: 8 8;
      animation: dash-flow 25s linear infinite;
    }
    .flow-line-2 {
      stroke-dasharray: 6 6;
      animation: dash-flow-rev 20s linear infinite;
    }
    .pulse-node {
      animation: pulse-dot 3s ease-in-out infinite;
    }
    .pill-hover {
      transition: transform 0.3s ease;
    }
    @keyframes float-orb1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, 30px) scale(1.15); }
      100% { transform: translate(-40px, -20px) scale(0.95); }
    }
    @keyframes float-orb2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-70px, -40px) scale(1.1); }
      100% { transform: translate(50px, 20px) scale(0.9); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -300; }
    }
    @keyframes dash-flow-rev {
      to { stroke-dashoffset: 300; }
    }
    @keyframes pulse-dot {
      0%, 100% { r: 4px; opacity: 0.6; }
      50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Subtle Tech Grid -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Layer 1: Background Animated Ambient Glow Orbs -->
  <g class="orb-1" opacity="0.45">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow-cyan)"/>
  </g>
  <g class="orb-2" opacity="0.35">
    <circle cx="1000" cy="280" r="160" fill="#8b5cf6" filter="url(#glow-purple)"/>
  </g>
  <g opacity="0.25">
    <circle cx="600" cy="360" r="110" fill="#06b6d4" filter="url(#glow-cyan)"/>
  </g>

  <!-- Layer 2: Dynamic Schematic Diagram Lines in Background -->
  <g opacity="0.5">
    <!-- Connecting curves representing API schemas and contract flows -->
    <path class="flow-line-1" d="M -50,300 C 250,380 400,280 600,320 C 800,360 950,260 1250,310" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-line-2" d="M -50,120 C 300,50 450,150 700,80 C 950,10 1050,130 1250,90" fill="none" stroke="#a855f7" stroke-width="1.75"/>
    
    <!-- Microservice nodes along lines -->
    <circle class="pulse-node" cx="240" cy="326" r="4" fill="#38bdf8"/>
    <circle class="pulse-node" cx="600" cy="320" r="4" fill="#818cf8"/>
    <circle class="pulse-node" cx="950" cy="285" r="4" fill="#c084fc"/>
    <circle class="pulse-node" cx="300" cy="85" r="4" fill="#38bdf8"/>
    <circle class="pulse-node" cx="700" cy="80" r="4" fill="#a855f7"/>
  </g>

  <!-- Layer 3: Foreground Content (Always on top, crisp & clear) -->
  <g id="foreground-content">
    <!-- Top Category Chip -->
    <g transform="translate(600, 75)">
      <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="-108" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-93" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">OPENAPI 3.1 &amp; SPEC MODELING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      API Specification &amp; Modeling
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Standards, Architecture Frameworks, Design-First Platforms &amp; Code Generators
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: OpenAPI 3.0 / 3.1 -->
      <g transform="translate(-390, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="24" cy="21" r="5" fill="#38bdf8"/>
        <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">OpenAPI 3.1</text>
      </g>

      <!-- Pill 2: AsyncAPI Specs -->
      <g transform="translate(-195, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="24" cy="21" r="5" fill="#a855f7"/>
        <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">AsyncAPI</text>
      </g>

      <!-- Pill 3: TypeSpec & Schemas -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="24" cy="21" r="5" fill="#10b981"/>
        <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">TypeSpec &amp; Schemas</text>
      </g>

      <!-- Pill 4: Code Generation -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="185" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
        <circle cx="24" cy="21" r="5" fill="#f59e0b"/>
        <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">SDK &amp; Docs Generation</text>
      </g>
    </g>

    <!-- Bottom Protocol Tags -->
    <text x="600" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      REST  •  EVENT-DRIVEN  •  JSON SCHEMA  •  LINTERS &amp; MOCKS  •  GOVERNANCE
    </text>
  </g>
</svg>
